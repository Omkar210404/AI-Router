# AIRouter model catalog. Edit freely; the app re-reads this file on every request.
# Model ids are "<provider>:<model name as the provider's API expects it>".
# Ollama models are not listed here: every model you have pulled shows up automatically.

[ollama]
# Installed Ollama models to leave out of the picker (they stay installed).
hide = ["qwen2.5-coder:7b"]

[[models]]
id = "gemini:gemini-2.5-flash"
label = "Gemini 2.5 Flash"
tier = "free"
speed = "fast"

[[models]]
id = "gemini:gemini-2.5-flash-lite"
label = "Gemini 2.5 Flash-Lite"
tier = "free"
speed = "fastest"

[[models]]
id = "gemini:gemini-2.5-pro"
label = "Gemini 2.5 Pro"
tier = "free"
speed = "slow"

[[models]]
id = "openai:gpt-5-mini"
label = "GPT-5 mini"
tier = "paid"
speed = "fast"

[[models]]
id = "openai:gpt-5"
label = "GPT-5"
tier = "paid"
speed = "slow"

[[models]]
id = "anthropic:claude-haiku-5-5"
label = "Claude Haiku 5.5"
tier = "paid"
speed = "fast"

[[models]]
id = "anthropic:claude-sonnet-5-5"
label = "Claude Sonnet 5.5"
tier = "paid"
speed = "medium"


# ---------------------------------------------------------------------------
# Router. Each query gets a score per category:
#   +keyword_weight (default 1) per keyword found (whole word/phrase, case-insensitive)
#   +pattern_weight (default 2) per regex pattern that matches
#   +short_bonus if the query has <= short_words words
#   +long_bonus  if the query has >= long_words words
# The highest score wins (ties go to the category listed first). Zero everywhere
# means "general". The router then picks the FIRST model in `prefer` that is
# configured. Entries may use * wildcards, e.g. "ollama:*coder*".
#
# These preferences are opinionated defaults, not benchmark results.
# Change them to match your own experience.
# ---------------------------------------------------------------------------

[categories.coding]
label = "Coding"
keywords = ["code", "function", "bug", "debug", "error", "exception", "traceback", "stack trace",
  "python", "javascript", "typescript", "java", "c++", "rust", "golang", "sql", "regex", "api",
  "compile", "refactor", "unit test", "class", "method", "variable", "array", "loop", "git",
  "react", "css", "html", "json", "script", "npm", "pip", "docker", "null pointer", "segfault"]
keyword_weight = 2
patterns = ['```', '\bdef \w+\(', '\bfunction\s*\w*\(', '=>', '\w+\(\)', '\bimport \w+', ';\s*$', '</?\w+>']
prefer = ["anthropic:claude-sonnet-5-5", "openai:gpt-5", "gemini:gemini-2.5-pro", "ollama:*coder*",
  "gemini:gemini-2.5-flash", "ollama:*"]
reason = "Coding question: Claude models tend to do well on code. A code-tuned local model is a free option."

[categories.math]
label = "Math"
keywords = ["solve", "equation", "integral", "derivative", "probability", "calculate", "proof",
  "prove", "theorem", "algebra", "matrix", "percent", "percentage", "sum of", "factorial",
  "prime", "geometry", "statistics", "how many ways"]
keyword_weight = 3
pattern_weight = 4
patterns = ['\d\s*[a-z]?\s*[-+*/^×÷=]\s*\d', '\d+(\.\d+)?\s*%', '\b[xyz]\s*[=^]', '\\(frac|int|sum)', '√|∫|∑|π']
prefer = ["openai:gpt-5", "gemini:gemini-2.5-pro", "anthropic:claude-sonnet-5-5",
  "gemini:gemini-2.5-flash", "ollama:llama*", "ollama:*"]
reason = "Math: a model with strong step-by-step reasoning is the safer bet."

[categories.creative]
label = "Creative writing"
keywords = ["poem", "story", "short story", "lyrics", "song", "haiku", "write a", "creative",
  "fiction", "character", "plot", "novel", "screenplay", "joke", "slogan", "tagline", "rhyme",
  "essay", "blog post", "toast", "speech"]
patterns = ['^\s*(write|compose|draft|imagine)\b']
prefer = ["anthropic:claude-sonnet-5-5", "openai:gpt-5", "gemini:gemini-2.5-flash", "ollama:llama*", "ollama:*"]
reason = "Creative writing: Claude is often preferred for natural-sounding prose."

[categories.quick_fact]
label = "Quick fact"
keywords = ["what is", "who is", "who was", "when did", "when was", "where is", "capital of",
  "define", "meaning of", "how tall", "how old", "how far", "population of", "convert"]
patterns = ['^\s*(what|who|when|where|which)\b[^.]*\?\s*$']
pattern_weight = 1
short_words = 12
short_bonus = 1
prefer = ["gemini:gemini-2.5-flash-lite", "gemini:gemini-2.5-flash", "anthropic:claude-haiku-5-5",
  "openai:gpt-5-mini", "ollama:llama*", "ollama:*"]
reason = "Quick fact: a fast, cheap model is enough. No need to wait for a big one."

[categories.reasoning]
label = "Long reasoning"
keywords = ["step by step", "compare", "trade-offs", "tradeoffs", "pros and cons", "analyze",
  "analyse", "explain why", "design", "architecture", "plan", "strategy", "evaluate",
  "recommend", "in depth", "detailed", "think through", "reason about"]
long_words = 60
long_bonus = 2
prefer = ["gemini:gemini-2.5-pro", "openai:gpt-5", "anthropic:claude-sonnet-5-5",
  "gemini:gemini-2.5-flash", "ollama:llama*", "ollama:*"]
reason = "Long reasoning: a larger model is worth the extra wait for multi-step thinking."

[categories.vision]
label = "Image / vision"
keywords = ["image", "photo", "picture", "screenshot", "diagram", "chart", "ocr", "this pic",
  "in the image", "look at", "what's in"]
keyword_weight = 3
prefer = ["gemini:gemini-2.5-flash", "openai:gpt-5", "anthropic:claude-sonnet-5-5"]
reason = "Image question: needs a multimodal model. Note: AIRouter can't attach images yet, so describe the image in text."

[categories.general]
label = "General chat"
keywords = []
prefer = ["gemini:gemini-2.5-flash", "anthropic:claude-haiku-5-5", "openai:gpt-5-mini", "ollama:llama*", "ollama:*"]
reason = "General chat: a fast all-rounder fits."
